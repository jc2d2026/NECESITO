<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NECESITO - App de Asistencia</title>
    <style>
        /* Estilos de Alto Contraste y Letras Gigantes para Baja Visión */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            color: #FFFF00; /* Amarillo brillante */
            margin-bottom: 25px;
            font-weight: bold;
        }
        /* 🟩 EL CUADRO DE PRESENTACIÓN DE TU FIGURA 1 Y 2 */
        #cuadro-presentacion {
            width: 100%;
            height: 380px;
            background-color: #1A1A1A;
            border: 6px solid #00FF00; /* Borde verde fosforescente grueso */
            border-radius: 25px;
            margin-bottom: 30px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            text-align: left;
        }
        /* 🔴 ENLACE EN ROJO GIGANTE SUBRAYADO SEGÚN TU DISEÑO */
        .enlace-maps {
            color: #FF3333; /* Rojo de alta visibilidad */
            font-size: 22px;
            font-weight: bold;
            text-decoration: underline; /* Subrayado obligatorio */
            line-height: 1.5;
            word-break: break-all;
        }
        .contenedor-categorias {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .boton-categoria {
            background-color: #1A1A1A;
            border: 4px solid #FFFF00;
            border-radius: 15px;
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            padding: 25px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .boton-categoria:active {
            background-color: #FFFF00;
            color: #000000;
        }
        .emergencia {
            border: 4px solid #FF0000 !important;
            color: #FF3333 !important;
        }
    </style>
</head>
<body>

    <h1>APP NECESITO</h1>
    
    <!-- 🟩 CUADRO DE PRESENTACIÓN CON ENLACE AUTOMÁTICO EN TIEMPO REAL -->
    <div id="cuadro-presentacion">
        <div id="contenido-gps" class="enlace-maps">Buscando señal de satélite automáticamente...</div>
    </div>

    <div class="contenedor-categorias">
        <button class="boton-categoria" onclick="procesarPedido('Farmacia')">1. Farmacia y Medicinas</button>
        <button class="boton-categoria" onclick="procesarPedido('Comida')">2. Comidas Preparadas</button>
        <button class="boton-categoria" onclick="procesarPedido('Bodega')">3. Bodegas y Abastecimiento</button>
        <button class="boton-categoria" onclick="procesarPedido('Tecnico')">4. Técnicos de Confianza</button>
        <button class="boton-categoria emergencia" onclick="procesarPedido('Emergencia')">5. Emergencia Vital y Salud</button>
        <button class="boton-categoria">6. OTROS - Personalizado</button>
    </div>

    <!-- 🔌 ENLACE AL MOTOR DE GEOLOCALIZACIÓN NATIVA -->
    <script src="gps.js"></script>

    <script>
        // Monitoreo constante para pintar el enlace de Google Maps real en letras rojas
        setInterval(() => {
            const enlaceGuardado = localStorage.getItem("ubicacion_remitente");
            const contenidoDiv = document.getElementById("contenido-gps");
            
            if (enlaceGuardado) {
                // Modifica el texto interior para calzar exactamente con tu Figura 2
                contenidoDiv.innerHTML = `MI UBICACION EN TIEMPO REAL:<br><a href="${enlaceGuardado}" target="_blank" style="color: #FF3333;">${enlaceGuardado}</a>`;
            }
        }, 1500);

        function procesarPedido(categoria) {
            const enlaceGps = localStorage.getItem("ubicacion_remitente");
            if (!enlaceGps) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance("Espere un segundo, calculando ubicación exacta."));
                return;
            }

            window.speechSynthesis.cancel();
            const respuesta = new SpeechSynthesisUtterance(`Solicitud de ${categoria} recibida. Tu ubicación real en el mapa ha sido enlazada con éxito.`);
            respuesta.lang = 'es-PE';
            window.speechSynthesis.speak(respuesta);
        }
    </script>

</body>
</html>
