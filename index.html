<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NECESITO - Alta Accesibilidad</title>
    <!-- Importamos Tailwind CSS para diseño estético -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col pb-24">

    <!-- Encabezado Principal -->
    <header class="bg-blue-600 text-white shadow-md p-4 text-center sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-wider flex justify-center items-center gap-2">
            <i class="fa-solid fa-hand-holding-hand"></i> NECESITO
        </h1>
        <p class="text-xs text-blue-100 mt-1">Plataforma de Alta Accesibilidad Social</p>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-5">
        
        <!-- Tarjeta de Ubicación -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                <i class="fa-solid fa-location-dot text-red-500 mr-1"></i> Mi Ubicación Actual
            </label>
            <div class="flex gap-2">
                <input type="text" id="ubicacion" placeholder="Buscando señal de GPS..." 
                    class="w-full bg-slate-100 border-none rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
                <button type="button" id="btn-audio-ubicacion" class="bg-blue-100 text-blue-600 rounded-xl px-4 hover:bg-blue-200 transition active:scale-90">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Tarjeta de Categoría de Necesidad -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                <i class="fa-solid fa-layer-group text-blue-500 mr-1"></i> Categoría de Necesidad
            </label>
            <div class="flex gap-2">
                <select id="categoria" class="w-full bg-slate-100 border-none rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
                    <option value="">Selecciona tipo (Profesional o Comprar)</option>
                    <option value="profesional">Contratar un Profesional / Técnico</option>
                    <option value="comprar">Realizar una Compra / Abastecimiento</option>
                </select>
                <button type="button" id="btn-audio-categoria" class="bg-blue-100 text-blue-600 rounded-xl px-4 hover:bg-blue-200 transition active:scale-90">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Tarjeta de Descripción -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                <i class="fa-solid fa-pen-to-square text-blue-500 mr-1"></i> Descripción del Pedido
            </label>
            <div class="flex gap-2 items-start">
                <textarea id="descripcion" rows="3" placeholder="Explica detalladamente en qué necesitas ayuda..." 
                    class="w-full bg-slate-100 border-none rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                <button type="button" id="btn-audio-descripcion" class="bg-blue-100 text-blue-600 rounded-xl p-4 hover:bg-blue-200 transition active:scale-90">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Botón de Envío Acción Principal -->
        <button type="button" id="btn-enviar" class="w-full bg-emerald-500 text-white font-bold rounded-2xl p-4 shadow-lg hover:bg-emerald-600 transition transform active:scale-95 flex justify-center items-center gap-2 text-base">
            <i class="fa-solid fa-paper-plane"></i> ENVIAR SOLICITUD
        </button>

    </main>

    <!-- Barra de Navegación Inferior Estilo App Móvil -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-50 shadow-xl">
        <div class="max-w-md mx-auto flex justify-around p-2 text-center">
            <button class="flex flex-col items-center text-blue-600 font-bold text-xs gap-1 flex-1" onclick="cambiarFiltro('profesional')">
                <span class="text-xl">👷</span>
                <span>TÉCNICOS</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-blue-500 font-medium text-xs gap-1 flex-1" onclick="cambiarFiltro('comprar')">
                <span class="text-xl">🛒</span>
                <span>COMPRAS</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-blue-500 font-medium text-xs gap-1 flex-1" onclick="alert('Sección de Farmacia en desarrollo')">
                <span class="text-xl">💊</span>
                <span>FARMACIA</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-blue-500 font-medium text-xs gap-1 flex-1" onclick="alert('Sección Vital/Emergencia en desarrollo')">
                <span class="text-xl">🧑‍⚕️</span>
                <span>VITAL</span>
            </button>
        </div>
    </nav>

    <!-- SISTEMA LOGICO EN JAVASCRIPT -->
    <script>
        // 1. OBTENCIÓN AUTOMÁTICA DE UBICACIÓN (GPS)
        window.addEventListener('DOMContentLoaded', () => {
            const inputUbicacion = document.getElementById('ubicacion');
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        inputUbicacion.value = `Lat: ${lat}, Lon: ${lon}`;
                    },
                    (error) => {
                        console.error(error);
                        inputUbicacion.value = "Permiso de GPS denegado por el usuario.";
                        inputUbicacion.removeAttribute('readonly');
                        inputUbicacion.placeholder = "Escribe tu dirección manualmente...";
                    }
                );
            } else {
                inputUbicacion.value = "Tu navegador no soporta localización.";
                inputUbicacion.removeAttribute('readonly');
            }
        });

        // 2. SISTEMA DE RECONOCIMIENTO DE VOZ (SPEECH TO TEXT)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const configurarMicrofono = (idBoton, idInput, esSelect = false) => {
                const boton = document.getElementById(idBoton);
                const inputElement = document.getElementById(idInput);
                const rec = new SpeechRecognition();
                
                rec.lang = 'es-PE'; // Configurado para español peruano
                rec.interimResults = false;
                rec.maxAlternatives = 1;

                rec.onstart = () => {
                    boton.classList.remove('bg-blue-100', 'text-blue-600');
                    boton.classList.add('bg-red-500', 'text-white', 'animate-pulse');
                };

                rec.onend = () => {
                    boton.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                    boton.classList.add('bg-blue-100', 'text-blue-600');
                };

                rec.onresult = (event) => {
                    const textoEscuchado = event.results[0][0].transcript.toLowerCase();
                    
                    if (esSelect) {
                        // Lógica de llenado automático inteligente para el selector de categoría
                        if (textoEscuchado.includes('profesional') || textoEscuchado.includes('técnico') || textoEscuchado.includes('trabajo')) {
                            inputElement.value = 'profesional';
                        } else if (textoEscuchado.includes('comprar') || textoEscuchado.includes('tienda') || textoEscuchado.includes('abastecer')) {
                            inputElement.value = 'comprar';
                        } else {
                            alert('No entendí la categoría. Di "Profesional" o "Comprar"');
                        }
                    } else {
                        // Llenado de texto estándar
                        inputElement.value = event.results[0][0].transcript;
                    }
                };

                boton.addEventListener('click', () => {
                    rec.start();
                });
            };

            // Activamos los tres botones de dictado por voz de la interfaz
            configurarMicrofono('btn-audio-ubicacion', 'ubicacion');
            configurarMicrofono('btn-audio-categoria', 'categoria', true);
            configurarMicrofono('btn-audio-descripcion', 'descripcion');

        } else {
            // Si el navegador es antiguo o no compatible (como algunos navegadores integrados de Facebook)
            const deshabilitarMics = ['btn-audio-ubicacion', 'btn-audio-categoria', 'btn-audio-descripcion'];
            deshabilitarMics.forEach(id => {
                const btn = document.getElementById(id);
                btn.style.display = 'none';
            });
            console.log("El reconocimiento de voz no es compatible con este navegador.");
