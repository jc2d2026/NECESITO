<!-- ========================================== -->
<!-- BLOQUE DE UBICACIÓN REAL (MONOBLOCK CORREGIDO) -->
<!-- ========================================== -->
<div id="bloque-ubicacion" style="border: 3px solid #00FF00; background-color: #0A0A0A; border-radius: 15px; padding: 15px; margin: 10px 0; font-family: sans-serif; color: #FFFFFF; text-align: left;">
    
    <div style="display: flex; align-items: center; margin-bottom: 8px;">
        <span style="color: #4CAF50; font-size: 20px; margin-right: 8px;">🟢</span>
        <span style="color: #FF3B30; font-weight: bold; font-size: 16px; letter-spacing: 0.5px;">UBICACIÓN REAL:</span>
    </div>

    <!-- Las palabras "Lat:" y "Lon:" se quedan estáticas aquí. No viajan al mapa -->
    <div style="color: #FF453A; font-size: 15px; line-height: 1.4; margin-left: 28px; font-weight: 500;">
        Lat: <span id="txt-latitud">Obteniendo...</span>, Lon: <span id="txt-longitud">Obteniendo...</span>
        <br>
        <span style="color: #FF453A; font-size: 14px;">(Precisión: <span id="txt-precision">0</span> metros)</span>
    </div>

    <!-- El botón que ejecutará el enlace completamente limpio -->
    <a id="enlace-mapa" href="#" target="_blank" style="display: block; margin-top: 12px; margin-left: 28px; color: #00FF00; text-decoration: none; font-size: 14px; font-weight: bold; letter-spacing: 0.3px;">
        👉 TOCA AQUÍ PARA VER TU MAPA INSTANTÁNEO
    </a>
</div>

<!-- ========================================== -->
<!-- SCRIPT DE GEOLOCALIZACIÓN (JS INTEGRADO)   -->
<!-- ========================================== -->
<script>
function iniciarGps() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(function(position) {
            // Guardamos valores numéricos puros de los sensores
            var valorLatitud = position.coords.latitude;
            var valorLongitud = position.coords.longitude;
            var valorPrecision = position.coords.accuracy.toFixed(1);

            // Pasamos los números puros a la pantalla del usuario
            document.getElementById("txt-latitud").innerText = valorLatitud;
            document.getElementById("txt-longitud").innerText = valorLongitud;
            document.getElementById("txt-precision").innerText = valorPrecision;

            // REPARACIÓN CLAVE: El link se arma ÚNICAMENTE con los valores numéricos y la coma intermedia
            var direccionMapsLimple = "https://google.com" + valorLatitud + "," + valorLongitud;
            
            // Asignamos el enlace limpio al botón verde
            document.getElementById("enlace-mapa").href = direccionMapsLimple;

        }, function(error) {
            console.error("Fallo de Geolocalización:", error);
        }, {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 6000
        });
    } else {
        alert("El navegador no cuenta con soporte de GPS.");
    }
}

// Inicializa el proceso al cargar la página
window.addEventListener('load', iniciarGps);
</script>
