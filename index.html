<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP NECESITO - Alta Accesibilidad</title>
    <meta name="theme-color" content="#1e3a8a">

    <style>
        /* DISEÑO DE ALTO CONTRASTE REFORZADO */
        :root { 
            --bg-principal: #0f172a; 
            --tarjeta-bg: #1e293b;   
            --texto-blanco: #ffffff; 
            --texto-amarillo: #fde047;
            --verde-boton: #22c55e;   
            --azul-borde: #3b82f6;
        }
        
        body { 
            font-family: system-ui, -apple-system, Arial, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-principal); 
            color: var(--texto-blanco);
        }
        
        header { 
            background-color: #1e3a8a; 
            text-align: center; 
            padding: 20px 10px;
            border-bottom: 4px solid var(--azul-borde);
        }
        
        header h1 { margin: 0; font-size: 28px; color: var(--texto-amarillo); }
        header p { margin: 5px 0 0 0; font-size: 16px; color: var(--texto-blanco); }

        main { max-width: 500px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        
        .card { 
            background: var(--tarjeta-bg); 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 3px solid var(--azul-borde); 
        }
        
        .card-title { 
            font-size: 16px; 
            font-weight: bold; 
            color: var(--texto-amarillo); 
            margin-bottom: 12px; 
            text-transform: uppercase;
        }
        
        .input-control { 
            width: 100%; 
            padding: 18px; 
            border: 3px solid #64748b; 
            border-radius: 12px; 
            font-size: 18px; 
            outline: none; 
            background-color: #0f172a;
            color: var(--texto-blanco);
            box-sizing: border-box;
            font-weight: bold;
        }
        
        select.input-control { height: 60px; color: var(--texto-amarillo); }
        
        .btn-submit { 
            width: 100%; 
            background-color: var(--verde-boton); 
            color: #000000; 
            border: none; 
            border-radius: 16px; 
            padding: 22px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        
        .results-section { margin-top: 25px; }
        
        .result-item { 
            padding: 18px; 
            background: #1e293b; 
            margin: 12px 0; 
            border-radius: 12px; 
            border-left: 10px solid var(--azul-borde); 
            font-size: 18px; 
            font-weight: bold;
            color: var(--texto-blanco);
        }
        
        .local-info { 
            background-color: #0f172a; 
            padding: 14px; 
            border-radius: 8px; 
            margin-top: 10px; 
            font-size: 16px; 
            color: #cbd5e1; 
            border-left: 4px solid var(--verde-boton); 
        }
        
        .coordenadas-caja {
            background-color: #0f172a;
            padding: 14px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 16px;
            color: #cbd5e1;
            border-left: 4px solid var(--texto-amarillo);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤝 APP NECESITO</h1>
        <p>Plataforma de Alta Accesibilidad Social</p>
    </header>

    <main>
        <!-- 1. CATEGORÍA DE NECESIDAD -->
        <section class="card">
            <div class="card-title">📁 1. Categoría de necesidad prioritaria</div>
            <select class="input-control" id="select-categoria">
                <option value="farmacia">💊 Farmacia y Medicinas Especiales</option>
                <option value="comida">🍕 Comida Preparada (Pizzerías, Pollerías)</option>
                <option value="compras">🛒 Abarrotes y Abastecimiento (Bodegas)</option>
                <option value="tecnicos">👷 Técnicos de Confianza</option>
                <option value="vital">🧑‍⚕️ Emergencia Vital y Salud</option>
            </select>
        </section>

        <!-- 2. DETALLE DEL PEDIDO -->
        <section class="card">
            <div class="card-title">📝 2. Detalle de tu pedido</div>
            <input type="text" class="input-control" id="txt-pedido" placeholder="Ej: salbutamol, pollo a la brasa, electricista">
        </section>

        <!-- 3. MI UBICACIÓN EN COORDENADAS -->
        <section class="card">
            <div class="card-title">📍 3. Mi ubicación en coordenadas (Tiempo Real)</div>
            <input type="text" class="input-control" id="txt-ubicacion" value="Las Antaras 186, Chorrillos ✔️" readonly style="background-color: #0f172a; border-color: #334155; color: var(--texto-amarillo);">
            <div id="txt-coordenadas" class="coordenadas-caja">GPS Activo Lat: -12.19366 | Lon: -77.00448</div>
        </section>

        <!-- BOTÓN GIGANTE VERDE CON ACCIÓN FORZADA -->
        <button class="btn-submit" id="btn-enviar">🚀 PROCESAR SOLICITUD NOW</button>

        <!-- PANEL DE RESULTADOS DE SOLUCIONES -->
        <section class="results-section">
            <div class="card-title" style="color: var(--texto-blanco);">✨ Soluciones Encontradas</div>
            <div id="lista-resultados" style="font-size: 16px; color: #94a3b8;">Los resultados aparecerán aquí al presionar el botón verde.</div>
        </section>
    </main>

    <script>
        // Desactivar cualquier rastro de Service Worker viejo para limpiar por completo
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var registration of registrations) {
                    registration.unregister();
                }
            });
        }

        // Base de datos local e inmediata de Chorrillos
        var baseDatosLocales = [
            { nombre: "Botica Arcángel (Av. José Antonio Lavalle cuadra 2)", categoria: "farmacia", info: "Medicinas esenciales y stock de Salbutamol. Muy cercana a tu ubicación." },
            { nombre: "Farmacia Fénix (Las Antaras 149)", categoria: "farmacia", info: "Medicinas esenciales y stock de Salbutamol. A solo unos pasos de tu ubicación." },
            { nombre: "Pizzería Presto (Av. Huaylas / Chorrillos)", categoria: "comida", info: "Pizzas familiares e individuales. Entrega rápida en la zona de Las Antaras." },
            { nombre: "Pizza Hut (Prolongación Av. Huaylas)", categoria: "comida", info: "Especialidad en pizzas americanas, hawaianas y pastas." },
            { nombre: "Pollería Roky's (Av. Huaylas / Chorrillos)", categoria: "comida", info: "Pollo a la brasa caliente y combos familiares. Atención rápida." },
            { nombre: "Pollería Norkys (Prolongación Av. Huaylas)", categoria: "comida", info: "Atención local en platos a la brasa, papas fritas y parrillas." },
            { nombre: "Bodega Delia (Calle Las Antaras 190)", categoria: "compras", info: "Abarrotes completos, alimentos de primera necesidad y atención local." },
            { nombre: "Servicios Eléctricos San Juan Bautista", categoria: "tecnicos", info: "Soporte técnico, reparaciones y emergencies eléctricas en la zona." },
            { nombre: "Clínica Médica de la Solidaridad", categoria: "vital", info: "Atención médica, chequeos rápidos y guardias asistenciales." }
        ];

        var posicionLat = -12.1936699;
        var posicionLng = -77.0044871;

        // Lector de voz asistida forzado
        function ejecutarVoz(mensaje) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var vocalizador = new SpeechSynthesisUtterance(mensaje);
                vocalizador.lang = 'es-PE';
                window.speechSynthesis.speak(vocalizador);
            }
        }

        // Forzar saludo en el primer toque de pantalla en cualquier lugar
        document.body.addEventListener('click', function() {
            ejecutarVoz("Aplicación Necesito en línea. Ubicación en Las Antaras 1 8 6.");
        }, { once: true });

        // LÓGICA DE PROCESAMIENTO TOTALMENTE CORREGIDA Y COMPROBADA
        document.getElementById('btn-enviar').addEventListener('click', function() {
            var catElegida = document.getElementById('select-categoria').value;
            var textoPedido = document.getElementById('txt-pedido').value.trim();
            
            var palabraBuscar = catElegida;
            if (textoPedido !== "") {
                palabraBuscar = textoPedido;
            } else {
                if (catElegida === "farmacia") palabraBuscar = "farmacia";
                if (catElegida === "comida") palabraBuscar = "restaurante polleria pizzeria";
                if (catElegida === "compras") palabraBuscar = "bodega market";
                if (catElegida === "tecnicos") palabraBuscar = "electricista";
                if (catElegida === "vital") palabraBuscar = "hospital";
            }

            // 1. Forzar al parlante a hablar de inmediato
            ejecutarVoz("Procesando solicitud de " + palabraBuscar);
            
            // 2. REPARACIÓN REFORZADA: Filtrar de forma limpia
            var localesFiltrados = baseDatosLocales.filter(function(comercio) {
                return comercio.categoria === catElegida;
            });
            
            var zonaTarjetas = document.getElementById('lista-resultados');
            zonaTarjetas.innerHTML = "";
            
            var mensajeDeVozSoluciones = "Encontramos " + localesFiltrados.length + " soluciones disponibles. ";
