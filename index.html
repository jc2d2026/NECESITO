<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NECESITO - Alta Accesibilidad</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">

    <style>
        :root { 
            --primary-blue: #2563eb; 
            --accent-green: #10b981; 
            --bg-light: #f8fafc; 
            --text-dark: #1e293b; 
            --card-bg: #ffffff; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-light); color: var(--text-dark); 
        }
        header { 
            background-color: var(--primary-blue); color: white; 
            text-align: center; padding: 15px 10px; 
        }
        main { max-width: 500px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        .card { 
            background: var(--card-bg); border-radius: 16px; 
            padding: 16px; margin-bottom: 16px; 
            border: 2px solid #cbd5e1; 
        }
        .card-title { font-size: 14px; font-weight: bold; color: #334155; margin-bottom: 12px; text-transform: uppercase; }
        .input-control { 
            width: 100%; padding: 16px; border: 2px solid #94a3b8; 
            border-radius: 12px; font-size: 16px; outline: none; 
            color: var(--text-dark); box-sizing: border-box;
        }
        select.input-control { height: 54px; font-weight: bold; }
        .btn-submit { 
            width: 100%; background-color: var(--accent-green); color: white; 
            border: none; border-radius: 14px; padding: 20px; 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .contenedor-mapa { 
            width: 100%; height: 260px; border-radius: 12px; 
            overflow: hidden; border: 2px solid #cbd5e1; 
            margin-top: 10px; background-color: #e2e8f0;
        }
        .mapa-visor {
            width: 100%; height: 100%; border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤝 INGRESAR A LA APP NECESITO</h1>
        <p>Plataforma de Alta Accesibilidad Social</p>
    </header>

    <main>
        <!-- 1. CATEGORÍA DE NECESIDAD -->
        <section class="card">
            <div class="card-title">📁 1. Categoría de necesidad prioritaria</div>
            <select class="input-control" id="select-categoria">
                <option value="farmacia">💊 Farmacia y Medicinas Especiales</option>
                <option value="comida">🍕 Comida Preparada (Pizzerías, Pollerías)</option>
                <option value="compras">🛒 Abarrotes y Abastecimiento (Bodegas)</option>
                <option value="tecnicos">👷 Técnicos de Confianza</option>
                <option value="vital">🧑‍⚕️ Emergencia Vital y Salud</option>
            </select>
        </section>

        <!-- 2. DETALLE DEL PEDIDO -->
        <section class="card">
            <div class="card-title">📝 2. Detalle de tu pedido</div>
            <input type="text" class="input-control" id="txt-pedido" placeholder="Ej: salbutamol, pollo a la brasa, electricista">
        </section>

        <!-- 3. MI UBICACIÓN AUTOMÁTICA -->
        <section class="card">
            <div class="card-title">📍 3. Mi ubicación automática (Tiempo Real)</div>
            <input type="text" class="input-control" id="txt-ubicacion" value="Buscando tu señal satelital GPS..." readonly style="background-color: #f1f5f9; border-color: #cbd5e1;">
            
            <!-- 🌟 VISOR DE MAPA REAL EN TIEMPO REAL SIN BLOQUEOS GRISES -->
            <div class="contenedor-mapa" id="bloque-mapa">
                <iframe id="visor-gps" class="mapa-visor" src="about:blank"></iframe>
            </div>
        </section>

        <!-- Botón Enviar Solicitud Directo -->
        <button class="btn-submit" id="btn-enviar">🚀 ENVIAR SOLICITUD REAL</button>
    </main>

    <script>
        let miLatitud = -12.1936699; // Coordenadas por defecto (Las Antaras)
        let miLongitud = -77.0044871;
        let gpsActivo = false;

        // Sistema de locución de voz asistida
        function hablarTexto(mensaje) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(mensaje);
                utterance.lang = 'es-PE';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Anuncio inicial de voz asistida
        let vozAnunciada = false;
        function activarAnuncioInmediato() {
            if (!vozAnunciada) {
                hablarTexto("Aplicación Necesito iniciada. Conectando con los satélites de tu ubicación actual.");
                vozAnunciada = true;
            }
        }
        document.body.addEventListener('touchstart', activarAnuncioInmediato, { once: true });
        document.body.addEventListener('click', activarAnuncioInmediato, { once: true });

        // 🛰️ CAPTURA SATELITAL COMPLETA DEL GPS REAL DEL TELÉFONO
        function capturarUbicacionDispositivo() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        miLatitud = position.coords.latitude;
                        miLongitud = position.coords.longitude;
                        gpsActivo = true;

                        // Cambia el cuadro de texto mostrando que el satélite lo localizó con éxito
                        document.getElementById('txt-ubicacion').value = "Ubicación Certificada por GPS ✔️";
                        hablarTexto("Satélite conectado. Tu ubicación actual ha sido detectada con éxito.");

                        // Carga el plano interactivo real con las calles y manzanas donde estés parado
                        const urlMapa = `https://google.com{miLatitud},${miLongitud}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
                        document.getElementById('visor-gps').src = urlMapa;
                    },
                    (error) => {
                        console.error("GPS denegado o apagado:", error);
                        document.getElementById('txt-ubicacion').value = "Las Antaras 188, Chorrillos (Señal Base) ✔️";
                        hablarTexto("No se pudo acceder al GPS del teléfono. Usando ubicación base de contingencia.");
                        
                        // Carga el mapa base de Las Antaras por defecto si el GPS del celular está apagado
                        const urlMapaBase = `https://google.com`;
                        document.getElementById('visor-gps').src = urlMapaBase;
                    },
                    { enableHighAccuracy: true, timeout: 7000 }
                );
            } else {
                // Si el navegador es muy antiguo
                const urlMapaBase = `https://google.com`;
                document.getElementById('visor-gps').src = urlMapaBase;
            }
        }

        // Ejecutar el rastreo GPS inmediatamente al abrir la pantalla
        window.addEventListener('load', capturarUbicacionDispositivo);

        // 🚀 ENRUTADOR DINÁMICO AL PRESIONAR "ENVIAR SOLICITUD" (ABRE RESULTADOS REALES)
        document.getElementById('btn-enviar').addEventListener('click', () => {
            const categoria = document.getElementById('select-categoria').value;
            const pedido = document.getElementById('txt-pedido').value.trim();
            
            // Decidir qué buscar en base a la necesidad del usuario
            let términoBúsqueda = categoria;
            if (pedido !== "") {
                términoBúsqueda = pedido;
            } else {
                if (categoria === "farmacia") términoBúsqueda = "farmacia botica";
                if (categoria === "comida") términoBúsqueda = "restaurante polleria pizzeria";
                if (categoria === "compras") términoBúsqueda = "bodega market";
                if (categoria === "tecnicos") términoBúsqueda = "servicio tecnico electricista gasfitero";
                if (categoria === "vital") términoBúsqueda = "hospital clinica emergencia";
            }

            hablarTexto(`Buscando soluciones de ${términoBúsqueda} en tiempo real a tu alrededor.`);

            // Genera el enlace de búsqueda geolocalizado real para abrir los locales más cercanos a tu posición actual
            setTimeout(() => {
                const urlResultadosReales = `https://google.com{encodeURIComponent(términoBúsqueda)}/@${miLatitud},${miLongitud},15z`;
                window.open(urlResultadosReales, '_blank');
            }, 1500);
        });
    </script>
</body>
</html>
