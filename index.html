<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NECESITO - App de Asistencia con Maps</title>
    <style>
        /* Estilos de Alto Contraste y Letras Gigantes para Baja Visión */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            color: #FFFF00; /* Amarillo brillante */
            margin-bottom: 15px;
        }
        /* 🗺️ VENTANA DE GOOGLE MAPS INTEGRADA EN PANTALLA */
        #contenedor-mapa {
            width: 100%;
            height: 250px;
            background-color: #222222;
            border: 4px solid #00FF00; /* Borde verde de confirmación */
            border-radius: 15px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .contenedor-categorias {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .boton-categoria {
            background-color: #1A1A1A;
            border: 4px solid #FFFF00;
            border-radius: 15px;
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            padding: 25px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .boton-categoria:active {
            background-color: #FFFF00;
            color: #000000;
        }
        .emergencia {
            border: 4px solid #FF0000 !important;
            color: #FF3333 !important;
        }
    </style>
</head>
<body>

    <h1>APP NECESITO</h1>
    
    <!-- 🗺️ EL MAPA DE GOOGLE SE CARGARÁ AUTOMÁTICAMENTE AQUÍ ADENTRO -->
    <iframe id="contenedor-mapa" src="" allowfullscreen="" loading="lazy"></iframe>

    <div class="contenedor-categorias">
        <button class="boton-categoria" onclick="procesarPedido('Farmacia')">1. Farmacia y Medicinas</button>
        <button class="boton-categoria" onclick="procesarPedido('Comida')">2. Comidas Preparadas</button>
        <button class="boton-categoria" onclick="procesarPedido('Bodega')">3. Bodegas y Abastecimiento</button>
        <button class="boton-categoria" onclick="procesarPedido('Tecnico')">4. Técnicos de Confianza</button>
        <button class="boton-categoria emergencia" onclick="procesarPedido('Emergencia')">5. Emergencia Vital y Salud</button>
        <button class="boton-categoria">6. OTROS - Personalizado</button>
    </div>

    <!-- 🔌 ENLACE MANDATORIO AL MOTOR GPS (PROCESA LA UBICACIÓN EN SEGUNDO PLANO) -->
    <script src="gps.js"></script>

    <script>
        // Monitoreo constante del éxito del GPS para actualizar el mapa en pantalla
        setInterval(() => {
            const precision = localStorage.getItem("precision_gps");
            const mapaIframe = document.getElementById("contenedor-mapa");
            
            // Si el motor gps.js ya capturó las coordenadas, incrustamos el mapa vivo
            if (precision && mapaIframe.src === "") {
                // Recuperamos el punto guardado por el chip del celular
                const enlaceGuardado = localStorage.getItem("ubicacion_remitente");
                if (enlaceGuardado) {
                    // Extraemos las coordenadas para meterlas al visor de Google Maps oficial
                    const coordenadas = enlaceGuardado.split("?q=")[1];
                    mapaIframe.src = `https://google.com{coordenadas}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
                    console.log("Google Maps vinculado y dibujado con éxito en la pantalla.");
                }
            }
        }, 2000);

        function procesarPedido(categoria) {
            const enlaceGps = localStorage.getItem("ubicacion_remitente");
            if (!enlaceGps) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance("Espere un segundo, calculando ubicación precisa."));
                return;
            }

            window.speechSynthesis.cancel();
            const respuesta = new SpeechSynthesisUtterance(`Solicitud de ${categoria} recibida. Tu ubicación en Prolongación Huaylas ha sido enviada de forma automática.`);
            respuesta.lang = 'es-PE';
            window.speechSynthesis.speak(respuesta);
        }
    </script>

</body>
</html>
