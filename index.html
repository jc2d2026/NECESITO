<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NECESITO</title>
    <style>
        body { background-color: #000; color: #FFF; font-family: Arial; text-align: center; padding: 15px; margin: 0; }
        h1 { font-size: 28px; color: #FFF000; margin: 10px 0; font-weight: bold; }
        
        /* 🟩 EL RECUADRO VERDE DE PRESENTACIÓN INTEGRADO */
        #cuadro-presentacion {
            width: 100%; max-width: 500px; height: 380px; background-color: #1A1A1A;
            border: 6px solid #00FF00; border-radius: 20px; margin: 0 auto 20px;
            padding: 15px; box-sizing: border-box; display: flex; flex-direction: column;
        }
        
        /* 🔴 DATA DE COORDENADAS EN LETRAS ROJAS */
        #data-coordenadas {
            color: #FF3333; font-size: 16px; font-weight: bold; text-align: left;
            margin-bottom: 10px; min-height: 40px; line-height: 1.3;
        }

        /* 🗺️ MAPA INTERACTIVO DE GOOGLE MAPS DENTRO DEL CUADRO */
        #visor-mapa {
            width: 100%; flex-grow: 1; background-color: #222;
            border: 2px solid #333; border-radius: 10px; box-sizing: border-box;
        }
        
        .contenedor-botones { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .boton { background-color: #1A1A1A; border: 4px solid #FFF000; border-radius: 12px; color: #FFF; font-size: 22px; font-weight: bold; padding: 20px; cursor: pointer; }
        .boton:active { background-color: #FFF000; color: #000; }
        .alert { border: 4px solid #FF0000 !important; color: #FF3333 !important; }
    </style>
</head>
<body>

    <h1>APP NECESITO</h1>
    
    <!-- 🟩 RECUADRO CON DATA DE COORDENADAS Y MAPA VIVO EN TIEMPO REAL -->
    <div id="cuadro-presentacion">
        <div id="data-coordenadas">Buscando señal satelital automática...</div>
        <iframe id="visor-mapa" src="" allowfullscreen="" loading="lazy"></iframe>
    </div>

    <div class="contenedor-botones">
        <button class="boton" onclick="pedir('Farmacia y Medicinas')">1. Farmacia y Medicinas</button>
        <button class="boton" onclick="pedir('Comidas Preparadas')">2. Comidas Preparadas</button>
        <button class="boton" onclick="pedir('Bodegas y Abastecimiento')">3. Bodegas y Abastecimiento</button>
        <button class="boton" onclick="pedir('Técnicos de Confianza')">4. Técnicos de Confianza</button>
        <button class="boton alert" onclick="pedir('Emergencia Vital')">5. Emergencia Vital y Salud</button>
    </div>

    <script>
        // MOTOR DE LOCALIZACIÓN LIGERO INTEGRADO DIRECTAMENTE AQUÍ
        document.addEventListener("DOMContentLoaded", () => {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(coordenadasExitosas, errorGps, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });
            } else {
                document.getElementById("data-coordenadas").innerHTML = "Tu dispositivo no soporta GPS.";
            }
        });

        function coordenadasExitosas(posicion) {
            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;
            const precision = posicion.coords.accuracy;

            // 1. Mostrar la data visual de coordenadas en el texto rojo
            document.getElementById("data-coordenadas").innerHTML = 
                `🟢 UBICACIÓN REAL:<br>Lat: ${lat.toFixed(6)}, Lon: ${lon.toFixed(6)} (Error: ${precision.toFixed(1)}m)`;

            // 2. Cargar el mapa interactivo de Google Maps automáticamente dentro del cuadro
            const visor = document.getElementById("visor-mapa");
            const urlMapaEmbed = `https://google.com{lat},${lon}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
            
            if (visor.src !== urlMapaEmbed) {
                visor.src = urlMapaEmbed;
            }

            // Guardar en memoria temporal el enlace directo por si se pulsa
            localStorage.setItem("enlace_directo_maps", `https://google.com{lat},${lon}`);
        }

        function errorGps() {
            document.getElementById("data-coordenadas").innerHTML = "Buscando mejor señal de satélite en Chorrillos...";
        }

        function pedir(servicio) {
            window.speechSynthesis.cancel();
            const voz = new SpeechSynthesisUtterance(`Solicitud de ${servicio} recibida. Tu ubicación real ha sido enlazada.`);
            voz.lang = 'es-PE';
            window.speechSynthesis.speak(voz);
        }
    </script>

</body>
</html>
