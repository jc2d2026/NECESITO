<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP NECESITO - Alta Accesibilidad</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e3a8a">

    <style>
        :root { 
            --bg-principal: #0f172a; 
            --tarjeta-bg: #1e293b;   
            --texto-blanco: #ffffff; 
            --texto-amarillo: #fde047;
            --verde-boton: #22c55e;   
            --azul-borde: #3b82f6;
        }
        
        body { 
            font-family: system-ui, -apple-system, Arial, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-principal); 
            color: var(--texto-blanco);
        }
        
        header { 
            background-color: #1e3a8a; 
            text-align: center; 
            padding: 20px 10px;
            border-bottom: 4px solid var(--azul-borde);
        }
        
        header h1 { margin: 0; font-size: 28px; color: var(--texto-amarillo); }
        header p { margin: 5px 0 0 0; font-size: 16px; color: var(--texto-blanco); }

        main { max-width: 500px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        
        .card { 
            background: var(--tarjeta-bg); 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 3px solid var(--azul-borde); 
        }
        
        .card-title { 
            font-size: 16px; 
            font-weight: bold; 
            color: var(--texto-amarillo); 
            margin-bottom: 12px; 
            text-transform: uppercase;
        }
        
        .input-control { 
            width: 100%; 
            padding: 18px; 
            border: 3px solid #64748b; 
            border-radius: 12px; 
            font-size: 18px; 
            outline: none; 
            background-color: #0f172a;
            color: var(--texto-blanco);
            box-sizing: border-box;
            font-weight: bold;
        }
        
        select.input-control { height: 60px; color: var(--texto-amarillo); }
        
        .btn-submit { 
            width: 100%; 
            background-color: var(--verde-boton); 
            color: #000000; 
            border: none; 
            border-radius: 16px; 
            padding: 22px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        
        .results-section { margin-top: 25px; }
        
        .result-item { 
            padding: 18px; 
            background: #1e293b; 
            margin: 12px 0; 
            border-radius: 12px; 
            border-left: 10px solid var(--azul-borde); 
            font-size: 18px; 
        }
        
        .local-info { 
            background-color: #0f172a; 
            padding: 14px; 
            border-radius: 8px; 
            margin-top: 10px; 
            font-size: 16px; 
            color: #cbd5e1; 
            border-left: 4px solid var(--verde-boton); 
        }
        
        .coordenadas-caja {
            background-color: #0f172a;
            padding: 14px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 16px;
            color: #cbd5e1;
            border-left: 4px solid var(--texto-amarillo);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤝 APP NECESITO</h1>
        <p>Plataforma de Alta Accesibilidad Social</p>
    </header>

    <main>
        <!-- 1. CATEGORÍA DE NECESIDAD -->
        <section class="card">
            <div class="card-title">📁 1. Categoría de necesidad prioritaria</div>
            <select class="input-control" id="select-categoria">
                <option value="farmacia">💊 Farmacia y Medicinas Especiales</option>
                <option value="comida">🍕 Comida Preparada (Pizzerías, Pollerías)</option>
                <option value="compras">🛒 Abarrotes y Abastecimiento (Bodegas)</option>
                <option value="tecnicos">👷 Técnicos de Confianza</option>
                <option value="vital">🧑‍⚕️ Emergencia Vital y Salud</option>
            </select>
        </section>

        <!-- 2. DETALLE DEL PEDIDO -->
        <section class="card">
            <div class="card-title">📝 2. Detalle de tu pedido</div>
            <input type="text" class="input-control" id="txt-pedido" placeholder="Ej: salbutamol, pollo a la brasa, electricista">
        </section>

        <!-- 3. MI UBICACIÓN EN COORDENADAS DINÁMICAS -->
        <section class="card">
            <div class="card-title">📍 3. Mi ubicación en coordenadas (Tiempo Real)</div>
            <input type="text" class="input-control" id="txt-ubicacion" value="Detectando tu dirección por satélite..." readonly style="background-color: #0f172a; border-color: #334155; color: var(--texto-amarillo);">
            <!-- Caja de texto numérica libre de coordenadas fijas de servidor -->
            <div id="txt-coordenadas" class="coordenadas-caja">GPS: Buscando señal de tu equipo...</div>
        </section>

        <!-- BOTÓN GIGANTE VERDE -->
        <button class="btn-submit" id="btn-enviar">🚀 ENVIAR SOLICITUD</button>

        <!-- PANEL DE RESULTADOS DE SOLUCIONES -->
        <section class="results-section">
            <div class="card-title" style="color: var(--texto-blanco);">✨ Soluciones Encontradas</div>
            <div id="lista-resultados" style="font-size: 16px; color: #94a3b8;">Los resultados aparecerán aquí al presionar el botón verde.</div>
        </section>
    </main>

    <script>
        // Registrar Service Worker de forma segura
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(function(err) { console.error(err); });
            });
        }

        // Base de datos de respaldo
        var baseDatosLocales = [
            { nombre: "Farmacia de Guardia Local", categoria: "farmacia", info: "Medicinas esenciales a corta distancia de tu ubicación actual." },
            { nombre: "Restaurante y Sabor Local", categoria: "comida", info: "Alimentos preparados y platos tradicionales con entrega a tu posición." }
        ];

        // 🌟 VARIABLES EN BLANCO: Obliga a cada equipo a calcular su propia posición
        var posicionLat = null;
        var posicionLng = null;

        function ejecutarVoz(mensaje) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var vocalizador = new SpeechSynthesisUtterance(mensaje);
                vocalizador.lang = 'es-PE';
                window.speechSynthesis.speak(vocalizador);
            }
        }

        var audioIniciado = false;
        function darBienvenida() {
            if (!audioIniciado) {
                ejecutarVoz("Aplicación Necesito iniciada. Buscando tu ubicación satelital única.");
                audioIniciado = true;
            }
        }
        document.body.addEventListener('touchstart', darBienvenida, { once: true });
        document.body.addEventListener('click', darBienvenida, { once: true });

        // 🛰️ CAPTURA SATELITAL REAL Y SEGUIMIENTO CONTINUO INDEPENDIENTE
        function ejecutarRastreoGPS() {
            if (navigator.geolocation) {
                // Sigue los movimientos del celular en tiempo real y actualiza coordenadas
                navigator.geolocation.watchPosition(
                    function(position) {
                        posicionLat = position.coords.latitude;
                        posicionLng = position.coords.longitude;
                        
                        document.getElementById('txt-coordenadas').innerText = "Tu GPS Real Lat: " + posicionLat.toFixed(5) + " | Lon: " + posicionLng.toFixed(5);
                        document.getElementById('txt-ubicacion').value = "Tu Ubicación Generada ✔️";
                    },
                    function(error) {
                        document.getElementById('txt-coordenadas').innerText = "Por favor activa el GPS de tu equipo móvil.";
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                document.getElementById('txt-coordenadas').innerText = "Tu dispositivo no cuenta con sensor GPS.";
            }
        }
        window.addEventListener('load', ejecutarRastreoGPS);

        // ACCIÓN DEL BOTÓN VERDE TOTALMENTE INDEPENDIENTE
        document.getElementById('btn-enviar').addEventListener('click', function() {
            var catElegida = document.getElementById('select-categoria').value;
            var textoPedido = document.getElementById('txt-pedido').value.trim();
            
            var palabraBuscar = catElegida;
            if (textoPedido !== "") {
                palabraBuscar = textoPedido;
            }

            ejecutarVoz("Buscando soluciones para " + palabraBuscar);
            
            var localesFiltrados = baseDatosLocales.filter(function(comercio) {
                return comercio.categoria === catElegida;
            });
            
            var zonaTarjetas = document.getElementById('lista-resultados');
            zonaTarjetas.innerHTML = "";
            
            var mensajeDeVozSoluciones = "Procesando solicitud. ";
            if (localesFiltrados.length > 0) {
                localesFiltrados.forEach(function(item) {
                    var tarjetaDiv = document.createElement('div');
                    tarjetaDiv.className = 'result-item';
                    tarjetaDiv.innerHTML = "<strong>🏢 " + item.nombre + "</strong><div class='local-info'>ℹ️ " + item.info + "</div>";
                    zonaTarjetas.appendChild(tarjetaDiv);
