<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NECESITO</title>
    <style>
        body { background-color: #000; color: #FFF; font-family: Arial; text-align: center; padding: 20px; }
        h1 { font-size: 32px; color: #FFF000; margin-bottom: 20px; }
        
        /* El cuadro verde amigable de tu Figura 1 y 2 */
        #cuadro-gps {
            width: 100%; height: 350px; background-color: #1A1A1A;
            border: 6px solid #00FF00; border-radius: 25px;
            padding: 25px; box-sizing: border-box; text-align: left;
        }
        /* Enlace rojo grande y subrayado */
        .texto-rojo-maps { color: #FF3333; font-size: 22px; font-weight: bold; text-decoration: underline; line-height: 1.5; }
        
        .contenedor-botones { display: flex; flex-direction: column; gap: 20px; max-width: 500px; margin: 30px auto 0; }
        .boton { background-color: #1A1A1A; border: 4px solid #FFF000; border-radius: 15px; color: #FFF; font-size: 24px; font-weight: bold; padding: 25px; cursor: pointer; }
        .boton:active { background-color: #FFF000; color: #000; }
        .alert { border: 4px solid #FF0000 !important; color: #FF3333 !important; }
    </style>
</head>
<body>

    <h1>APP NECESITO</h1>
    
    <div id="cuadro-gps">
        <div id="enlace-dinamico" class="texto-rojo-maps">Buscando señal satelital...</div>
    </div>

    <div class="contenedor-botones">
        <button class="boton" onclick="pedir('Farmacia y Medicinas')">1. Farmacia y Medicinas</button>
        <button class="boton" onclick="pedir('Comidas Preparadas')">2. Comidas Preparadas</button>
        <button class="boton" onclick="pedir('Bodegas y Abastecimiento')">3. Bodegas y Abastecimiento</button>
        <button class="boton" onclick="pedir('Técnicos de Confianza')">4. Técnicos de Confianza</button>
        <button class="boton alert" onclick="pedir('Emergencia Vital')">5. Emergencia Vital y Salud</button>
        <button class="boton" onclick="pedir('Otros Servicios')">6. OTROS - Personalizado</button>
    </div>

    <!-- Conexión directa a tu motor GPS -->
    <script src="gps.js"></script>

    <script>
        // Revisa la memoria cada segundo y pinta el enlace real de Google Maps
        setInterval(() => {
            const gpsReal = localStorage.getItem("ubicacion_remitente");
            if (gpsReal) {
                document.getElementById("enlace-dinamico").innerHTML = `MI UBICACION EN TIEMPO REAL:<br><a href="${gpsReal}" target="_blank" style="color: #FF3333;">${gpsReal}</a>`;
            }
        }, 1000);

        // Sistema de respuesta amigable por voz
        function pedir(servicio) {
            const puntoMaps = localStorage.getItem("ubicacion_remitente");
            window.speechSynthesis.cancel();
            
            const voz = new SpeechSynthesisUtterance(puntoMaps 
                ? `Solicitud de ${servicio} recibida. Tu ubicación real en el mapa ha sido enlazada con éxito.`
                : "Calculando ubicación precisa, por favor espere un segundo.");
            voz.lang = 'es-PE';
            window.speechSynthesis.speak(voz);
        }
    </script>

</body>
</html>
