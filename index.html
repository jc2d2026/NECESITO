<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP NECESITO - Alta Accesibilidad</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">

    <style>
        :root { 
            --primary-blue: #2563eb; 
            --accent-green: #10b981; 
            --bg-light: #f8fafc; 
            --text-dark: #1e293b; 
            --card-bg: #ffffff; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-light); color: var(--text-dark); 
        }
        header { 
            background-color: var(--primary-blue); color: white; 
            text-align: center; padding: 15px 10px; 
        }
        main { max-width: 500px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        .card { 
            background: var(--card-bg); border-radius: 16px; 
            padding: 16px; margin-bottom: 16px; 
            border: 2px solid #cbd5e1; 
        }
        .card-title { font-size: 14px; font-weight: bold; color: #334155; margin-bottom: 12px; text-transform: uppercase; }
        .input-control { 
            width: 100%; padding: 16px; border: 2px solid #94a3b8; 
            border-radius: 12px; font-size: 16px; outline: none; 
            color: var(--text-dark); box-sizing: border-box;
        }
        select.input-control { height: 54px; font-weight: bold; }
        .btn-submit { 
            width: 100%; background-color: var(--accent-green); color: white; 
            border: none; border-radius: 14px; padding: 20px; 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .contenedor-mapa { 
            width: 100%; height: 260px; border-radius: 12px; 
            overflow: hidden; border: 2px solid #cbd5e1; 
            margin-top: 10px; background-color: #cbd5e1;
        }
        .mapa-visor {
            width: 100%; height: 100%; border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤝 APP NECESITO</h1>
        <p>Plataforma de Alta Accesibilidad Social</p>
    </header>

    <main>
        <!-- 1. CATEGORÍA DE NECESIDAD -->
        <section class="card">
            <div class="card-title">📁 1. Categoría de necesidad prioritaria</div>
            <select class="input-control" id="select-categoria">
                <option value="farmacia">💊 Farmacia y Medicinas Especiales</option>
                <option value="comida">🍕 Comida Preparada (Pizzerías, Pollerías)</option>
                <option value="compras">🛒 Abarrotes y Abastecimiento (Bodegas)</option>
                <option value="tecnicos">👷 Técnicos de Confianza</option>
                <option value="vital">🧑‍⚕️ Emergencia Vital y Salud</option>
            </select>
        </section>

        <!-- 2. DETALLE DEL PEDIDO -->
        <section class="card">
            <div class="card-title">📝 2. Detalle de tu pedido</div>
            <input type="text" class="input-control" id="txt-pedido" placeholder="Ej: salbutamol, pollo a la brasa, electricista">
        </section>

        <!-- 3. MI UBICACIÓN AUTOMÁTICA -->
        <section class="card">
            <div class="card-title">📍 3. Mi ubicación automática (Tiempo Real)</div>
            <input type="text" class="input-control" id="txt-ubicacion" value="Buscando señal GPS..." readonly style="background-color: #f1f5f9; border-color: #cbd5e1;">
            
            <!-- VISOR DE MAPA CONFIGURADO PARA SER CARGADO EN SEGUNDO PLANO -->
            <div class="contenedor-mapa">
                <iframe id="visor-gps" class="mapa-visor" src="about:blank"></iframe>
            </div>
        </section>

        <!-- BOTÓN DE ENVÍO DE SOLICITUD -->
        <button class="btn-submit" id="btn-enviar">🚀 ENVIAR SOLICITUD</button>
    </main>

    <script>
        let miLatitud = -12.1936699; 
        let miLongitud = -77.0044871;

        // Lector de voz asistida
        function hablarTexto(mensaje) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(mensaje);
                utterance.lang = 'es-PE';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Bienvenida por voz
        let vozAnunciada = false;
        function activarAnuncioInmediato() {
            if (!vozAnunciada) {
                hablarTexto("Aplicación Necesito iniciada. Conectando con los sensores satelitales.");
                vozAnunciada = true;
            }
        }
        document.body.addEventListener('touchstart', activarAnuncioInmediato, { once: true });
        document.body.addEventListener('click', activarAnuncioInmediato, { once: true });

        // CAPTURA SATELITAL REAL DEL DISPOSITIVO
        function capturarUbicacionDispositivo() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        miLatitud = position.coords.latitude;
                        miLongitud = position.coords.longitude;

                        document.getElementById('txt-ubicacion').value = "Ubicación Certificada por GPS ✔️";
                        hablarTexto("Satélite conectado. Tu ubicación ha sido registrada.");

                        // Cargar plano urbano estable de OpenStreetMap libre de bloqueos
                        const urlMapaEstable = "https://openstreetmap.org" + (miLongitud - 0.003) + "%2C" + (miLatitud - 0.002) + "%2C" + (miLongitud + 0.003) + "%2C" + (miLatitud + 0.002) + "&layer=mapnik&marker=" + miLatitud + "%2C" + miLongitud;
                        document.getElementById('visor-gps').src = urlMapaEstable;
                    },
                    (error) => {
                        console.error("GPS inaccesible:", error);
                        document.getElementById('txt-ubicacion').value = "Las Antaras 188, Chorrillos ✔️";
                        hablarTexto("Usando ubicación base de contingencia.");
                        
                        const urlMapaBase = "https://openstreetmap.org-77.0074871%2C-12.1956699%2C-77.0014871%2C-12.1916699&layer=mapnik&marker=-12.1936699%2C-77.0044871";
                        document.getElementById('visor-gps').src = urlMapaBase;
                    },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else {
                const urlMapaBase = "https://openstreetmap.org-77.0074871%2C-12.1956699%2C-77.0014871%2C-12.1916699&layer=mapnik&marker=-12.1936699%2C-77.0044871";
                document.getElementById('visor-gps').src = urlMapaBase;
            }
        }

        window.addEventListener('load', capturarUbicacionDispositivo);

        // ENRUTADOR UNIVERSAL DE MAPAS DIRECTOS COMPATIBLE CON CACHÉ DE CELULARES
        document.getElementById('btn-enviar').addEventListener('click', () => {
            const categoria = document.getElementById('select-categoria').value;
            const pedido = document.getElementById('txt-pedido').value.trim();
            
            let terminoBusqueda = categoria;
            if (pedido !== "") {
                terminoBusqueda = pedido;
            } else {
                if (categoria === "farmacia") terminoBusqueda = "farmacia botica";
                if (categoria === "comida") terminoBusqueda = "restaurante polleria pizzeria";
                if (categoria === "compras") terminoBusqueda = "bodega market";
                if (categoria === "tecnicos") terminoBusqueda = "servicio tecnico electricista";
                if (categoria === "vital") terminoBusqueda = "hospital clinica emergencia";
            }

            hablarTexto("Buscando soluciones de " + terminoBusqueda + " a tu alrededor.");

            // 🌟 ENLACE UNIVERSAL INTEGRADO: Elimina por completo el error de dominios corruptos o pegados
            setTimeout(() => {
                const urlResultadosCorrecta = "https://google.com" + encodeURIComponent(terminoBusqueda) + "&ll=" + miLatitud + "," + miLongitud + "&z=16";
                window.open(urlResultadosCorrecta, '_blank');
            }, 1500);
        });
    </script>
</body>
</html>
