<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP NECESITO</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #ffffff; --accent: #fde047; --btn: #22c55e; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        header { background: #1e3a8a; text-align: center; padding: 20px 10px; border-bottom: 4px solid #3b82f6; }
        header h1 { margin: 0; font-size: 28px; color: var(--accent); }
        main { max-width: 500px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 3px solid #3b82f6; }
        .card-title { font-size: 16px; font-weight: bold; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; }
        .input-control { width: 100%; padding: 18px; border: 3px solid #64748b; border-radius: 12px; font-size: 18px; background: #0f172a; color: var(--text); box-sizing: border-box; font-weight: bold; }
        select.input-control { height: 60px; color: var(--accent); }
        .btn-submit { width: 100%; background: var(--btn); color: #000000; border: none; border-radius: 16px; padding: 22px; font-size: 22px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .results-section { margin-top: 25px; }
        .result-item { padding: 18px; background: #1e293b; margin: 12px 0; border-radius: 12px; border-left: 10px solid #3b82f6; font-size: 18px; font-weight: bold; }
        .local-info { background: #0f172a; padding: 14px; border-radius: 8px; margin-top: 10px; font-size: 16px; color: #cbd5e1; border-left: 4px solid var(--btn); }
        .coordenadas-caja { background: #0f172a; padding: 14px; border-radius: 8px; margin-top: 10px; font-family: monospace; font-size: 16px; color: #cbd5e1; border-left: 4px solid var(--accent); font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>🤝 APP NECESITO</h1>
        <p>Plataforma de Alta Accesibilidad Social</p>
    </header>
    <main>
        <section class="card">
            <div class="card-title">📁 1. Categoría de necesidad prioritaria</div>
            <select class="input-control" id="select-categoria">
                <option value="farmacia">💊 Farmacia y Medicinas Especiales</option>
                <option value="comida">🍕 Comida Preparada (Pizzerías, Pollerías)</option>
                <option value="compras">🛒 Abarrotes y Abastecimiento (Bodegas)</option>
                <option value="tecnicos">👷 Técnicos de Confianza</option>
                <option value="vital">🧑‍⚕️ Emergencia Vital y Salud</option>
            </select>
        </section>
        <section class="card">
            <div class="card-title">📝 2. Detalle de tu pedido</div>
            <input type="text" class="input-control" id="txt-pedido" placeholder="Ej: salbutamol, pollo a la brasa">
        </section>
        <section class="card">
            <div class="card-title">📍 3. Mi ubicación en coordenadas (Tiempo Real)</div>
            <input type="text" class="input-control" id="txt-ubicacion" value="Las Antaras 186, Chorrillos ✔️" readonly style="background-color: #0f172a; border-color: #334155; color: var(--accent);">
            <div id="txt-coordenadas" class="coordenadas-caja">GPS Activo Lat: -12.19366 | Lon: -77.00448</div>
        </section>
        <button class="btn-submit" id="btn-enviar">🚀 PROCESAR SOLICITUD NOW</button>
        <section class="results-section">
            <div class="card-title">✨ Soluciones Encontradas</div>
            <div id="lista-resultados" style="font-size: 16px; color: #94a3b8;">Los resultados aparecerán aquí al presionar el botón verde.</div>
        </section>
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var r of regs) { r.unregister(); }
            });
        }
        var baseDatosLocales = [
            { nombre: "Botica Arcángel (Av. José Antonio Lavalle cuadra 2)", categoria: "farmacia", info: "Medicinas esenciales y stock de Salbutamol. Muy cercana a tu ubicación." },
            { nombre: "Farmacia Fénix (Las Antaras 149)", categoria: "farmacia", info: "Medicinas esenciales y stock de Salbutamol. A solo unos pasos." },
            { nombre: "Pizzería Presto (Av. Huaylas / Chorrillos)", categoria: "comida", info: "Pizzas familiares e individuales. Entrega rápida." },
            { nombre: "Pollería Roky's (Av. Huaylas / Chorrillos)", categoria: "comida", info: "Pollo a la brasa caliente y combos familiares." },
            { nombre: "Bodega Delia (Calle Las Antaras 190)", categoria: "compras", info: "Abarrotes completos, alimentos de primera necesidad." }
        ];
        var posicionLat = -12.1936699; var posicionLng = -77.0044871;
        function ejecutarVoz(msg) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var v = new SpeechSynthesisUtterance(msg); v.lang = 'es-PE';
                window.speechSynthesis.speak(v);
            }
        }
        document.body.addEventListener('click', function() {
            ejecutarVoz("Aplicación Necesito en línea. Ubicación en Las Antaras 1 8 6.");
        }, { once: true });
        document.getElementById('btn-enviar').addEventListener('click', function() {
            var cat = document.getElementById('select-categoria').value;
            var ped = document.getElementById('txt-pedido').value.trim();
            var buscar = ped !== "" ? ped : cat;
            ejecutarVoz("Procesando solicitud de " + buscar);
            var filtrados = baseDatosLocales.filter(function(c) { return c.categoria === cat; });
            var zona = document.getElementById('lista-resultados'); zona.innerHTML = "";
            var txtVoz = "Encontramos " + filtrados.length + " soluciones. ";
            filtrados.forEach(function(item) {
                var div = document.createElement('div'); div.className = 'result-item';
                div.innerHTML = "<strong>🏢 " + item.nombre + "</strong><div class='local-info'>ℹ️ " + item.info + "</div>";
                zona.appendChild(div); txtVoz += "Establecimiento: " + item.nombre + ". ";
            });
            setTimeout(function() { ejecutarVoz(txtVoz); }, 1500);
            setTimeout(function() {
                var url = "https://google.com" + encodeURIComponent(buscar) + "/@" + posicionLat + "," + posicionLng + ",15z";
                window.open(url, '_blank');
            }, 6000);
        });
    </script>
</body>
</html>
