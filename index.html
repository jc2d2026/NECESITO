<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NECESITO - App de Asistencia</title>
    <style>
        /* Estilos de Alto Contraste y Letras Gigantes para Baja Visión */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            color: #FFFF00; /* Amarillo brillante para el título principal */
            margin-bottom: 30px;
        }
        .contenedor-categorias {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        /* Botones gigantes que ocupan buen espacio táctil */
        .boton-categoria {
            background-color: #1A1A1A;
            border: 4px solid #FFFF00;
            border-radius: 15px;
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            padding: 25px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .boton-categoria:active {
            background-color: #FFFF00;
            color: #000000;
        }
        /* Color especial rojo de alerta para la Emergencia */
        .emergencia {
            border-color: #FF0000;
            color: #FF3333;
        }
        .emergencia:active {
            background-color: #FF0000;
            color: #FFFFFF;
        }
    </style>
</head>
<body>

    <h1>APP NECESITO</h1>

    <div class="contenedor-categorias">
        <button class="boton-categoria">1. Farmacia y Medicinas</button>
        <button class="boton-categoria">2. Comidas Preparadas</button>
        <button class="boton-categoria">3. Bodegas y Abastecimiento</button>
        <button class="boton-categoria">4. Técnicos de Confianza</button>
        <button class="boton-categoria class=emergencia">5. Emergencia Vital y Salud</button>
        <button class="boton-categoria">6. OTROS - Personalizado</button>
    </div>

    <!-- 🔌 AQUÍ QUEDA CONECTADO TU MOTOR GPS AUTOMÁTICO DE ALTA PRECISIÓN -->
    <script src="gps.js"></script>

</body>
</html>
